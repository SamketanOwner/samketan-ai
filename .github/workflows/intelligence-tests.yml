name: Samketan Intelligence Unit Tests
on:
  push:
    branches:
      - feature/samketan-v2-security-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed Python modules
        run: python -m py_compile samketan_intelligence/*.py tests/test_*.py
      - name: Run isolated intelligence tests
        run: python -m unittest discover -s tests -v
